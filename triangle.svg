<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="t d">
  <title id="t">How the referral works</title>
  <desc id="d">Three parties exchange value. The gig worker gives consent and gets recognized income. The partner gives a referral and earnings data and gets 100 dollars per activated customer. The bank gives a real account at bank rates and gets a 100 dollar acquisition cost against 350 to 600 dollar industry estimates. In the center, the bank checks the income against deposits it already sees.</desc>
  <style>
    .f { font-family: "Plus Jakarta Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .h { font-size: 22px; font-weight: 700; fill: #1E2D42; }
    .lab { font-size: 13px; font-weight: 700; fill: #5B7FA6; letter-spacing: 1.5px; }
    .b { font-size: 16px; fill: #1E2D42; }
    .s { font-size: 14px; fill: #7A90A6; }
  </style>

  <!-- solid background so it reads on light and dark GitHub -->
  <rect width="960" height="720" fill="#FFFFFF"/>

  <text class="f" x="40" y="52" font-size="26" font-weight="700" fill="#1E2D42">How the referral works</text>
  <text class="f s" x="40" y="78">Each party gives something it already has and gets something it can't get alone.</text>

  <!-- triangle -->
  <polygon points="480,175 185,560 775,560" fill="#EEF2F6" stroke="#5B7FA6" stroke-width="3" stroke-linejoin="round"/>

  <!-- center mechanism -->
  <circle cx="480" cy="432" r="98" fill="#1E2D42"/>
  <text class="f" text-anchor="middle" fill="#B8C9D8" font-size="12" font-weight="700" letter-spacing="1.5">
    <tspan x="480" y="378">THE CHECK</tspan>
  </text>
  <text class="f" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600">
    <tspan x="480" y="406">Income verified</tspan>
    <tspan x="480" y="428">against deposits</tspan>
    <tspan x="480" y="450">the bank</tspan>
    <tspan x="480" y="472">already sees</tspan>
  </text>

  <!-- Partner (top) -->
  <rect x="300" y="100" width="360" height="150" rx="14" fill="#FFFFFF" stroke="#5B7FA6" stroke-width="2"/>
  <text class="f h" x="480" y="134" text-anchor="middle">Partner</text>
  <text class="f s" x="480" y="156" text-anchor="middle">talent agency, tax advisor, platform</text>
  <text class="f lab" x="326" y="190">GIVES</text>
  <text class="f b" x="390" y="190">referral + earnings data</text>
  <text class="f lab" x="326" y="222">GETS</text>
  <text class="f b" x="390" y="222">$100 per activated customer</text>

  <!-- Gig worker (bottom left) -->
  <rect x="20" y="500" width="340" height="188" rx="14" fill="#FFFFFF" stroke="#5B7FA6" stroke-width="2"/>
  <text class="f h" x="190" y="536" text-anchor="middle">Gig worker</text>
  <text class="f s" x="190" y="558" text-anchor="middle">W-2 job plus 1099 side income</text>
  <text class="f lab" x="46" y="594">GIVES</text>
  <text class="f b" x="110" y="594">consent to share</text>
  <text class="f b" x="110" y="614">earnings data</text>
  <text class="f lab" x="46" y="646">GETS</text>
  <text class="f b" x="110" y="646">recognized income and</text>
  <text class="f b" x="110" y="666">access to bank products</text>

  <!-- Client Bank (bottom right) -->
  <rect x="600" y="500" width="340" height="188" rx="14" fill="#FFFFFF" stroke="#5B7FA6" stroke-width="2"/>
  <text class="f h" x="770" y="536" text-anchor="middle">Client Bank</text>
  <text class="f s" x="770" y="558" text-anchor="middle">regional bank</text>
  <text class="f lab" x="626" y="594">GIVES</text>
  <text class="f b" x="690" y="594">a real account</text>
  <text class="f b" x="690" y="614">at bank rates</text>
  <text class="f lab" x="626" y="646">GETS</text>
  <text class="f b" x="690" y="646">$100 acquisition cost vs</text>
  <text class="f b" x="690" y="666">$350 to $600 industry est.</text>
</svg>
